name: strengthwise
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.2+14

environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.5
  flutter_native_splash: ^2.3.1
  get_it: ^7.6.0
  shared_preferences: ^2.1.2
  image_picker: ^0.8.7+5
  file_picker: ^8.1.6  # 用於 Windows 平台選擇檔案
  intl: ^0.20.2
  # ⭐ Local Cache (Hive)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  table_calendar: ^3.0.9
  fl_chart: ^1.1.1
  google_fonts: ^6.2.0
  supabase_flutter: ^2.0.0  # Supabase 客户端
  flutter_dotenv: ^5.1.0     # 环境变量管理
  uuid: ^4.5.1               # UUID 生成
  google_sign_in: ^6.1.5     # Google 登入（Supabase Auth 使用）
  elegant_notification: ^2.2.2  # 現代化頂部通知（2025 最佳實踐）
  flutter_animate: ^4.5.0    # 微動畫支援
  app_links: ^6.3.2          # Deep Link 支援（Email 確認連結）
  qr_flutter: ^4.1.0         # QR Code 生成
  mobile_scanner: ^5.1.1     # QR Code 掃描（新一代）
  permission_handler: ^11.0.0  # 相機權限管理
  
  # ⭐ v3.0-C: 推播通知
  firebase_messaging: ^15.1.6     # FCM 推播（Android/iOS）
  firebase_core: ^3.8.1           # Firebase 核心（FCM 必需）
  flutter_local_notifications: ^18.0.1  # 本地通知顯示
  connectivity_plus: ^7.0.0
  tutorial_coach_mark: ^1.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  # devtools_mcp_extension: ^0.1.0  # 需要 Dart 3.7+，CI 暫不支援
  flutter_launcher_icons: ^0.13.1
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/templates/  # 繪圖底圖模板
    - assets/splash/     # 啟動頁圖片
    - .env  # 环境变量文件

# App Icon 配置
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0a1628"
  adaptive_icon_foreground: "assets/icon/icon.png"
  min_sdk_android: 21

# 啟動畫面配置（符合 UI/UX 規範）
flutter_native_splash:
  # 淺色模式（#F1F5F9 Slate 50）
  color: "#F1F5F9"
  image: "assets/splash/splash_logo.png"
  
  # 深色模式（#0F172A Deep Slate）
  color_dark: "#0F172A"
  image_dark: "assets/splash/splash_logo.png"
  
  # Android 12+
  android_12:
    color: "#F1F5F9"
    image: "assets/splash/splash_logo.png"
    color_dark: "#0F172A"
    image_dark: "assets/splash/splash_logo.png"
