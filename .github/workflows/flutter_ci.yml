# StrengthWise Flutter CI/CD
# 觸發條件：PR 到 main、push 到 main、手動觸發

name: Flutter CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]
  workflow_dispatch: # 手動觸發

env:
  FLUTTER_VERSION: "3.27.0"  # 需要 Dart 3.6+ 支援 fl_chart
  JAVA_VERSION: "17"

jobs:
  # ============================================
  # Job 1: 分析與測試
  # ============================================
  analyze_and_test:
    name: 分析與測試
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: 📦 Get Dependencies
        run: flutter pub get

      - name: 🔍 Analyze Code
        run: flutter analyze --no-fatal-infos
        continue-on-error: false

      - name: 🧪 Run Tests
        run: flutter test --coverage
        continue-on-error: false

      - name: 📊 Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage/lcov.info
          fail_ci_if_error: false
        continue-on-error: true

  # ============================================
  # Job 2: 建置 Android（僅 main 分支）
  # ============================================
  build_android:
    name: 建置 Android
    runs-on: ubuntu-latest
    needs: analyze_and_test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: 📦 Get Dependencies
        run: flutter pub get

      # 解碼 Keystore（從 GitHub Secrets）
      - name: 🔑 Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/strengthwise-release.keystore

      # 建立 key.properties
      - name: 🔐 Create key.properties
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > android/key.properties << EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=strengthwise-release.keystore
          EOF

      - name: 🏗️ Build APK
        run: flutter build apk --release

      - name: 📦 Build AAB
        run: flutter build appbundle --release

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: 📤 Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab

